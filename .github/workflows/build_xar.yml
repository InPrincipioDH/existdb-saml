name: build xar file
on:
  push:
    branches:
      - bspp
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: set up java for ant
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Run ant build
        run: |
          ant
          ls -lh build

      - name: Upload XAR as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-xar
          path: build/*.xar
          retention-days: 30